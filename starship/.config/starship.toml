"$schema" = 'https://starship.rs/config-schema.json'

palette = 'tokyonight'

# Left side prompt
format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$git_metrics\
$fill\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
$docker_context\
$package\
$line_break\
$character\
"""

# Right side prompt 
right_format = """
$jobs\
${custom.home}\
$cmd_duration\
"""

[palettes.tokyonight]
color_fg0 = '#c0caf5'    # Soft Blue-White
color_bg1 = '#1a1b26'    # Deep Night Background
color_bg3 = '#292e42'    # Storm Blue Accent
color_blue = '#7aa2f7'   # Neon Blue
color_aqua = '#7dcfff'   # Cyan/Sky
color_green = '#9ece6a'  # Toxic Green
color_orange = '#ff9e64' # Sunset Orange
color_purple = '#bb9af7' # Bright Magenta
color_red = '#f7768e'    # Candy Red
color_yellow = '#e0af68' # Soft Gold

[palettes.catppuccin-dark]
color_fg0 = '#cdd6f4'
color_bg1 = '#1e1e2e'
color_bg3 = '#313244'
color_blue = '#89b4fa'
color_aqua = '#94e2d5'
color_green = '#a6e3a1'
color_orange = '#fab387'
color_purple = '#cba6f7'
color_red = '#f38ba8'
color_yellow = '#f9e2af'

[palettes.gruvbox-dark]
color_fg0 = '#fbf1c7'
color_bg1 = '#3c3836'
color_bg3 = '#665c54'
color_blue = '#83a598'
color_aqua = '#8ec07c'
color_green = '#b8bb26'
color_orange = '#fe8019'
color_purple = '#d3869b'
color_red = '#fb4934'
color_yellow = '#fabd2f'

[palettes.default]
color_fg0 = '#bbbbbb'
color_bg1 = '#222222'
color_bg3 = '#444444'
color_blue = '#005577'
color_aqua = '#5f8787'
color_green = '#859900'
color_orange = '#d65d0e'
color_purple = '#6c71c4'
color_red = '#dc322f'
color_yellow = '#b58900'

[os]
disabled = false
style = "fg:color_purple"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
Macos = "󰀵"
Linux = "󰌽"
Arch = "󰣇"
Void = " "

[sudo]
format = "[$symbol]($style)"
style = "fg:color_fg0"
symbol = "󰌾 "
disabled = false

[username]
show_always = true
style_user = "fg:color_purple" # Signature Tokyo Night Purple
style_root = "fg:color_red"
format = '[$user]($style)'

[hostname]
ssh_only = false
style = "fg:color_blue" # Neon Blue
format = '[ at ](fg:color_fg0)[$hostname]($style)'

[directory]
style = "fg:color_aqua" # Cyan accent
format = '[ in ](fg:color_fg0)[$path]($style)'
read_only = " 󰌾"
truncation_length = 3
truncation_symbol = ""

[git_branch]
symbol = "󰘬 "
style = "fg:color_green"
format = '[ on ](fg:color_fg0)[$symbol$branch ]($style)'

[git_status]
style = "fg:color_red"
format = '[$all_status $ahead_behind]($style)'
conflicted = "="
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
up_to_date = ""
untracked = "?"
stashed = "#"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "fg:color_red"

[git_metrics]
format = '([+$added ]($added_style))([-$deleted]($deleted_style))'
added_style = 'dimmed fg:color_green'
deleted_style = 'dimmed fg:color_red'
ignore_submodules = true
disabled = false

[fill]
symbol = " "

[time]
disabled = false
format = "[ $time]($style)"
time_format = "%I:%M %p"
utc_time_offset = "local"
style = "dimmed fg:color_fg0"

[cmd_duration]
format = "[ took ](fg:color_fg0)[$duration]($style)"
style = "fg:color_yellow"

[character]
disabled = false
success_symbol = '[](bold fg:color_purple)' # Purple lead for neon feel
error_symbol = '[](bold fg:color_red)'
vimcmd_symbol = '[](bold fg:color_green)'
vimcmd_replace_one_symbol = '[](bold fg:color_purple)'
vimcmd_replace_symbol = '[](bold fg:color_purple)'
vimcmd_visual_symbol = '[](bold fg:color_yellow)'

[jobs]
format = "[$symbol$number]($style) "
style = "fg:color_fg0"

# Language/tool detection
[nodejs]
symbol = "󰎙 "
style = "fg:color_green"
format = '[ ($symbol$version)]($style)'

[python]
symbol = " "
style = "fg:color_blue"
format = '[ ($symbol$version)]($style)'

[rust]
symbol = " "
style = "fg:color_orange"
format = '[ ($symbol$version)]($style)'

[package]
symbol = "󰏗 "
format = " $version"

[line_break]
disabled = false

[custom.home]
when = "test $HOME = $PWD"
format = " "
style = "fg:color_purple"
